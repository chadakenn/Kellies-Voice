plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Keep every test APK isolated. Hosted CI runners do not share debug signing
// keys, so an ordinary .debug update would conflict with an existing install.
// Use a unique, explicitly supplied package suffix for each workflow attempt.
// This does not modify the stable release or the existing .debug package.
def qaBuildId = providers.gradleProperty('qaBuildId').orElse('local').get()
if (!(qaBuildId ==~ /[a-z][a-z0-9]{0,40}/)) {
    throw new GradleException('qaBuildId must be 1-41 lowercase letters/digits, beginning with a letter')
}

android {
    namespace 'com.example.tvvoiceprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.tvvoiceprobe'
        minSdk 26
        targetSdk 35
        versionCode 54
        versionName '0.16.14'
        manifestPlaceholders = [
            appDisplayName: "Kellie's Voice",
            overlayDisplayName: "Kellie's Voice Overlay",
            dreamDisplayName: "Kellie's Voice Frigate",
        ]
        if (findProperty('skipWakeNative') != 'true') {
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    signingConfigs {
        release {
            def keyPath = System.getenv('TV_SIGNING_KEYSTORE_PATH')
            def keyPasswordValue = System.getenv('TV_SIGNING_PASSWORD')
            if (keyPath && keyPasswordValue) {
                storeFile file(keyPath)
                storePassword keyPasswordValue
                keyAlias 'tvvoice'
                keyPassword keyPasswordValue
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-test'
        }
        qa {
            initWith debug
            // Distinct from BOTH release and .debug; each CI attempt is
            // separately installable even with a new ephemeral signing key.
            applicationIdSuffix ".qa${qaBuildId}"
            versionNameSuffix "-qa-${qaBuildId}"
            manifestPlaceholders['appDisplayName'] = "Kellie's Voice QA"
            manifestPlaceholders['overlayDisplayName'] = "Kellie's Voice QA Overlay"
            manifestPlaceholders['dreamDisplayName'] = "Kellie's Voice QA Frigate"
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    if (findProperty('skipWakeNative') != 'true') {
        ndkVersion '27.2.12479018'
        externalNativeBuild {
            cmake {
                path 'src/main/cpp/CMakeLists.txt'
                version '3.22.1'
            }
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.tv:tv-foundation:1.0.0'
    implementation 'androidx.tv:tv-material:1.0.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
