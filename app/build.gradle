plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.tvvoiceprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.tvvoiceprobe'
        minSdk 26
        targetSdk 35
        // Restart opted-in Frigate watcher on APK updates/reboot; ambient diagnostics.
        versionCode 53
        versionName '0.16.13-dev.1'
        // Host unit tests pass -PskipWakeNative=true. An APK build compiles the engine.
        if (findProperty('skipWakeNative') != 'true') {
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    // The keystore is private and supplied from GitHub Actions secrets.
    // Never put the signing key or password into this public repository.
    signingConfigs {
        release {
            def keyPath = System.getenv('TV_SIGNING_KEYSTORE_PATH')
            def keyPasswordValue = System.getenv('TV_SIGNING_PASSWORD')
            if (keyPath && keyPasswordValue) {
                storeFile file(keyPath)
                storePassword keyPasswordValue
                keyAlias 'tvvoice'
                keyPassword keyPasswordValue
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-test'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    if (findProperty('skipWakeNative') != 'true') {
        ndkVersion '27.2.12479018'
        externalNativeBuild {
            cmake {
                path 'src/main/cpp/CMakeLists.txt'
                version '3.22.1'
            }
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    testImplementation 'junit:junit:4.13.2'
}
