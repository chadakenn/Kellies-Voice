plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The dedicated QA app has one permanent package ID. Only trusted signed
// development workflows build it using the existing private keystore.
// Ephemeral PR debug signing keys must never be used to distribute QA updates.
android {
    namespace 'com.example.tvvoiceprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.tvvoiceprobe'
        minSdk 26
        targetSdk 35
        versionCode 54
        versionName '0.16.14'
        buildConfigField 'boolean', 'IS_QA', 'false'
        manifestPlaceholders = [
            appDisplayName: "Kellie's Voice",
            overlayDisplayName: "Kellie's Voice Overlay",
            dreamDisplayName: "Kellie's Voice Frigate",
        ]
        if (findProperty('skipWakeNative') != 'true') {
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    signingConfigs {
        release {
            def keyPath = System.getenv('TV_SIGNING_KEYSTORE_PATH')
            def keyPasswordValue = System.getenv('TV_SIGNING_PASSWORD')
            if (keyPath && keyPasswordValue) {
                storeFile file(keyPath)
                storePassword keyPasswordValue
                keyAlias 'tvvoice'
                keyPassword keyPasswordValue
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-test'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        qa {
            // Non-debuggable signed variant: don't distribute a debuggable app
            // under the same key that signs production.
            initWith release
            applicationIdSuffix '.qa'
            // QA releases have monotonic signed version codes and independent tags.
            versionNameSuffix "-qa.${project.findProperty('qaBuildNumber') ?: '1'}"
            buildConfigField 'boolean', 'IS_QA', 'true'
            manifestPlaceholders['appDisplayName'] = "Kellie's Voice QA"
            manifestPlaceholders['overlayDisplayName'] = "Kellie's Voice QA Overlay"
            manifestPlaceholders['dreamDisplayName'] = "Kellie's Voice QA Frigate"
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    lint {
        // The Lifecycle lint detector crashes against this Kotlin/UAST toolchain
        // with IncompatibleClassChangeError in ComposeSettingsActivity.kt.
        // Disable only the broken detector; preserve all other release lint checks.
        disable 'NullSafeMutableLiveData'
    }
    if (findProperty('skipWakeNative') != 'true') {
        ndkVersion '27.2.12479018'
        externalNativeBuild {
            cmake {
                path 'src/main/cpp/CMakeLists.txt'
                version '3.22.1'
            }
        }
    }
}

// Only the separate QA package gets an independent monotonically increasing
// versionCode. Never bump the production code merely to issue a QA build.
// Each published QA prerelease must increase -PqaVersionCode.
android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'qa') {
        def codeText = (project.findProperty('qaVersionCode') ?: '55').toString()
        if (!(codeText ==~ /[0-9]+/) || codeText.toLong() > 1000000L
                || codeText.toLong() <= android.defaultConfig.versionCode) {
            throw new GradleException('QA versionCode must be numeric and above current production build')
        }
        variant.outputs.all { output ->
            output.versionCodeOverride = codeText.toInteger()
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.tv:tv-foundation:1.0.0'
    implementation 'androidx.tv:tv-material:1.0.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
