start_timer:
  name: Start a TV timer
  description: Start or replace a named timer on one paired TV. Alert repeats until dismissed.
  fields:
    device_id:
      required: true
      selector:
        text:
    name:
      default: Timer
      selector:
        text:
    duration_seconds:
      required: true
      selector:
        number:
          min: 1
          max: 86400
          mode: box
    speak_alert:
      default: false
      selector:
        boolean:
    alert_phrase:
      selector:
        text:
cancel_timer:
  name: Cancel a named TV timer
  fields:
    device_id:
      required: true
      selector:
        text:
    name:
      default: Timer
      selector:
        text:
dismiss_timers:
  name: Dismiss ringing TV timers
  description: Dismiss completion alerts on one TV, leaving running timers alone.
  fields:
    device_id:
      required: true
      selector:
        text:
announce:
  fields:
    title:
      required: true
      example: Washer
      selector:
        text:
    text:
      required: true
      example: The washer is done.
      selector:
        text:
          multiline: true
    duration_seconds:
      example: 10
      selector:
        number:
          min: 4
          max: 45
          mode: box
    speak:
      description: Optional sentence for the TV to speak aloud. Silent by default. Rejects URLs.
      example: The washer is finished.
      selector:
        text:
    device_id:
      example: ""
      selector:
        text:
show_camera:
  fields:
    entity_id:
      required: true
      example: camera.front_door
      selector:
        entity:
          filter:
            domain: camera
    title:
      example: Front door
      selector:
        text:
    show_header:
      default: true
      selector:
        boolean:
    image_fit:
      default: crop
      selector:
        select:
          options:
            - crop
            - fit
    refresh_seconds:
      default: 0
      selector:
        number:
          min: 0
          max: 30
          step: 1
          mode: box
    duration_seconds:
      example: 20
      selector:
        number:
          min: 4
          max: 45
          mode: box
    speak:
      description: Optional short sentence to speak while the camera popup stays visible.
      example: Someone is at the front door.
      selector:
        text:
    device_id:
      example: ""
      selector:
        text:
show_live_camera:
  fields:
    entity_id:
      required: true
      example: camera.driveway
      selector:
        entity:
          filter:
            domain: camera
    title:
      example: Live driveway
      selector:
        text:
    show_header:
      default: true
      selector:
        boolean:
    image_fit:
      default: crop
      selector:
        select:
          options:
            - crop
            - fit
    refresh_seconds:
      default: 0
      selector:
        number:
          min: 0
          max: 30
          step: 1
          mode: box
    duration_seconds:
      example: 90
      selector:
        number:
          min: 4
          max: 180
          mode: box
    speak:
      description: Optional short sentence to speak while the camera popup stays visible.
      example: Someone is at the front door.
      selector:
        text:
    device_id:
      example: ""
      selector:
        text:

hide_camera:
  fields:
    device_id:
      example: ""
      selector:
        text:

show_forecast:
  fields:
    entity_id:
      example: weather.forecast_home
      selector:
        entity:
          filter:
            domain: weather
    duration_seconds:
      example: 20
      selector:
        number:
          min: 8
          max: 45
          mode: box
    device_id:
      example: ""
      selector:
        text:
