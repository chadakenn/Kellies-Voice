name: V3 HA ↔ TV secure pairing + owner credential gates

on:
  pull_request:
    paths:
      - 'custom_components/kellies_voice/pairing_key_commitment.py'
      - 'app/src/main/java/com/example/tvvoiceprobe/PairingKeyCommitment.java'
      - 'app/src/test/java/com/example/tvvoiceprobe/PairingKeyCommitmentTest.java'
      - 'tests/test_pairing_key_commitment_v3.py'
      - 'custom_components/kellies_voice/pairing_v3_verified.py'
      - 'tests/test_pairing_v3_verified_sas.py'
      - 'custom_components/kellies_voice/pairing_v3_wire.py'
      - 'tests/test_pairing_v3_wire.py'
      - 'app/src/main/java/com/example/tvvoiceprobe/PairingV3TvWireState.java'
      - 'app/src/test/java/com/example/tvvoiceprobe/PairingV3TvWireStateTest.java'
      - 'app/src/main/java/com/example/tvvoiceprobe/PairingV3LanWindow.java'
      - 'tests/test_pairing_v3_android_listener_contract.py'
      - 'app/src/main/java/com/example/tvvoiceprobe/PairingV3QaActivity.java'
      - 'tests/test_pairing_v3_debug_tv_ui.py'
      - 'custom_components/kellies_voice/config_flow.py'
      - 'custom_components/kellies_voice/manifest.json'
      - 'tests/test_pairing_v3_ha_config_flow.py'
      - '.github/workflows/pairing-key-commitment-v3.yml'
  workflow_dispatch:

jobs:
  offline-python-commitment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install P-256 test dependency
        run: python -m pip install 'cryptography>=44,<48'
      - name: Verify Python key commitment and shared Java vectors
        run: python -m unittest discover -s tests -p test_pairing_key_commitment_v3.py -v
      - name: Verify v3 SAS and TV remote-OK proof against frozen cross-language fixture
        run: python -m unittest discover -s tests -p test_pairing_v3_verified_sas.py -v
      - name: Test actual HA v3 ordered wire messages with a cryptographic TV peer
        run: python -m unittest discover -s tests -p test_pairing_v3_wire.py -v
      - name: Check bounded Android v3-only LAN listener and absence of credential routes
        run: python -m unittest discover -s tests -p test_pairing_v3_android_listener_contract.py -v
      - name: Check secure Android v3 on-screen remote flow and lifecycle cleanup
        run: python -m unittest discover -s tests -p test_pairing_v3_debug_tv_ui.py -v
      - name: Test actual Home Assistant config-flow discovery and human code form
        run: python -m unittest discover -s tests -p test_pairing_v3_ha_config_flow.py -v
      - name: Enforce owner-approved v3 production boundary and no legacy credential leak
        run: |
          python - <<'PY'
          from pathlib import Path
          ha = Path('custom_components/kellies_voice')
          app = Path('app/src/main/java/com/example/tvvoiceprobe')
          core = (ha / 'pairing_key_commitment.py').read_text()
          android = (app / 'PairingKeyCommitment.java').read_text()
          v3 = (ha / 'pairing_v3_verified.py').read_text()
          wire = (ha / 'pairing_v3_wire.py').read_text()
          tv_wire = (app / 'PairingV3TvWireState.java').read_text()
          tv_listener = (app / 'PairingV3LanWindow.java').read_text()
          tv_ui = (app / 'PairingV3QaActivity.java').read_text()
          # Keep legacy/identity verification primitives separate from tokens.
          for code in (core, android, v3, wire, tv_wire, tv_ui):
              assert 'auth/token' not in code
              assert 'CredentialStore(' not in code
          assert 'from .pairing_key_commitment import _session_bytes' in (ha / 'config_flow.py').read_text()
          assert 'pairing_v3_verified' not in (ha / 'config_flow.py').read_text()
          assert 'PairingKeyCommitment' not in (app / 'VoiceActivity.java').read_text()
          assert 'PairingV3TvWireState' not in (app / 'VoiceActivity.java').read_text()
          assert 'PairingV3LanWindow' not in (app / 'VoiceActivity.java').read_text()
          assert 'PairingV3LanWindow.start(' in tv_ui
          assert 'if (!BuildConfig.DEBUG && !BuildConfig.IS_QA)' not in tv_ui
          flow = (ha / 'config_flow.py').read_text()
          owner = (ha / 'v3/flow.py').read_text()
          assert 'V3OwnerPairingFlowMixin' in flow
          assert 'async_step_owner_approval' in owner
          assert owner.index('finish_owner_receipt(') < owner.index('finish_renewable_login(') < owner.index('async_create_entry(')
          assert 'approved_owner_login(' in owner
          assert 'owner_controls_ready(self.hass)' in owner
          assert 'await async_register_owner_ui(hass)' in (ha / '__init__.py').read_text()
          assert 'require_ssl=True' in (ha / 'v3/ha_https.py').read_text()
          assert 'new CredentialStore(activity).load() != null' in (app / 'FirstRunSetupActivity.java').read_text()
          print('PASS: owner/TV authentication gates precede HACS entry; existing manual login intact')
          PY
