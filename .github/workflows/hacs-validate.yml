name: Validate HACS integration

on:
  pull_request:
    paths:
      - 'hacs.json'
      - 'info.md'
      - 'custom_components/kellies_voice/**'
      - '.github/workflows/hacs-validate.yml'
  push:
    branches: [main, dev]
    paths:
      - 'hacs.json'
      - 'info.md'
      - 'custom_components/kellies_voice/**'
      - '.github/workflows/hacs-validate.yml'
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration
          # This mixed Android TV/HA repository is distributed as a HACS
          # custom repository rather than through the default HACS catalog.
          # Bundled local brand icons are checked by HACS validation.
          ignore: "topics"
