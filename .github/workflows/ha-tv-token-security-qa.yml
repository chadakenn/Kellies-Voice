name: HA TV credential privilege and restart recovery QA (no live tokens)

on:
  pull_request:
    paths:
      - 'custom_components/kellies_voice/pairing_device_token_guard.py'
      - 'tests/test_pairing_device_token_guard.py'
      - 'custom_components/kellies_voice/pairing_token_lease_journal.py'
      - 'tests/test_pairing_token_lease_journal.py'
      - '.github/workflows/ha-tv-token-security-qa.yml'
  workflow_dispatch:

jobs:
  token-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile standalone privilege and revocation guard
        run: python -m py_compile custom_components/kellies_voice/pairing_device_token_guard.py custom_components/kellies_voice/pairing_token_lease_journal.py
      - name: Reject owner/admin/system token transfer and test ID-based revocation
        run: |
          python -m unittest discover -s tests -p 'test_pairing_device_token_guard.py' -v
          python -m unittest discover -s tests -p 'test_pairing_token_lease_journal.py' -v
      - name: Ensure no live authorization/provisioning endpoint was added
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          p = Path('custom_components/kellies_voice/pairing_device_token_guard.py')
          source = p.read_text()
          ast.parse(source)
          assert '/auth/token' not in source
          assert 'async_create_refresh_token(' not in source
          assert 'async_create_entry(' not in source
          assert 'async_register_command(' not in source
          assert 'session.post(' not in source
          assert 'access_token: str' in source
          assert 'refresh_token: str' in source
          journal = Path('custom_components/kellies_voice/pairing_token_lease_journal.py').read_text()
          assert '_write_atomic' in journal and 'os.fsync' in journal
          assert 'async_remove_refresh_token(' in journal
          assert '/auth/token' not in journal and 'session.post(' not in journal
          assert 'async_create_refresh_token(' not in journal
          print('PASS: offline-only token identity, fsynced intent and orphan recovery')
          PY
