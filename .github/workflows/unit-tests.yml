name: Unit tests

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run fast JVM unit tests without native engine
        run: ./gradlew --no-daemon -PskipWakeNative=true :app:testDebugUnitTest
      - name: Build actual JNI-enabled debug APK for TV hardware testing
        # The previous skipWakeNative assembleDebug uploaded an APK with NO
        # libmicrowakeword.so; it could not test wake-word capture on a TV.
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Save test APK
        uses: actions/upload-artifact@v4
        with:
          name: Kellies-Voice-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
