name: Unit tests

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run fast JVM unit tests without native engine
        run: ./gradlew --no-daemon -PskipWakeNative=true :app:testDebugUnitTest
      - name: Compile non-debuggable QA variant without signing secrets
        # PRs must not have access to the long-term signing key.
        # This checks Kotlin/Java variant compilation, NOT an installable QA APK.
        run: ./gradlew --no-daemon -PskipWakeNative=true :app:compileQaKotlin :app:compileQaJavaWithJavac
      - name: Build actual JNI-enabled debug APK for TV hardware testing
        # The previous skipWakeNative assembleDebug uploaded an APK with NO
        # libmicrowakeword.so; it could not test wake-word capture on a TV.
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK contains both wake-word JNI libraries and model
        shell: bash
        run: bash .github/scripts/verify-wake-apk.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Verify full app beta separation and test center
        if: (github.head_ref == 'feature/full-app-beta-test-center' || github.head_ref == 'feature/v3qa-owner-approved-tv-login')
        run: python -m unittest discover -s tests -p 'test_full_app_beta_readiness.py' -v
      - name: Build isolated full app beta QA kit
        if: (github.head_ref == 'feature/full-app-beta-test-center' || github.head_ref == 'feature/v3qa-owner-approved-tv-login')
        run: |
          python scripts/package_ha_v3qa.py
          python scripts/package_full_app_beta_kit.py
      - name: Upload full app beta test kit
        if: (github.head_ref == 'feature/full-app-beta-test-center' || github.head_ref == 'feature/v3qa-owner-approved-tv-login')
        uses: actions/upload-artifact@v4
        with:
          name: Kellies-Voice-full-app-beta-kit
          path: dist/Kellies-Voice-Full-App-Beta-Kit.zip
          if-no-files-found: error
          retention-days: 7
      - name: Save test APK
        uses: actions/upload-artifact@v4
        with:
          name: Kellies-Voice-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
