name: Finalize private screenshot masks and wiki captions
on:
  push:
    branches: [docs/onn-october-photos]
    paths:
      - '.github/workflows/one-time-privacy-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[privacy-finalize-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Hide camera edge strip and photographer reflections
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw
          path='docs/screenshots/onn-live-camera-grid.jpg'
          im=Image.open(path).convert('RGB')
          w,h=im.size
          # Video tiles stop at ~61% screen height; strip/reflection below is private.
          box=(round(.796*w),round(.76*h),round(.994*w),round(.855*h))
          safe_close=im.crop(box)
          ImageDraw.Draw(im).rectangle((0,round(.609*h),w,round(.89*h)),fill=(9,11,15))
          im.paste(safe_close,box)
          im.save(path,'JPEG',quality=89,optimize=True,progressive=True)
          print('GRID_PRIVACY_COMPLETE')
          PY
      - name: Sync final redactions and captions to existing public Wiki
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-tmp 2>/dev/null
          if [ $? -ne 0 ]; then echo 'WIKI_SYNC_UNAVAILABLE'; exit 0; fi
          cp docs/screenshots/onn-live-camera-grid.jpg wiki-tmp/onn-live-camera-grid.jpg
          cp docs/screenshots/onn-frigate-dashboard.jpg wiki-tmp/onn-frigate-dashboard.jpg
          cp docs/wiki/Cameras-and-Frigate.md wiki-tmp/Cameras-and-Frigate.md
          cd wiki-tmp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add onn-live-camera-grid.jpg onn-frigate-dashboard.jpg Cameras-and-Frigate.md
          git commit -qm 'docs(privacy): final redacted gallery and captions'
          git push --quiet origin HEAD 2>/dev/null
          if [ $? -eq 0 ]; then echo 'WIKI_SYNC_SUCCESS'; else echo 'WIKI_SYNC_UNAVAILABLE'; fi
      - name: Commit image and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/one-time-privacy-finalize.yml
          git add docs/screenshots/onn-live-camera-grid.jpg
          git commit -m 'docs(privacy): cover remaining camera edge and reflections'
          git push origin HEAD:docs/onn-october-photos
